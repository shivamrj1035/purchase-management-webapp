services:
  - type: web
    name: property-management-backend
    runtime: python
    region: oregon
    plan: free
    branch: production
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: DATABASE_TYPE
        value: firestore
      - key: JWT_SECRET_KEY
        sync: false
      - key: FIREBASE_ADMIN_SDK_JSON
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        value: Property Purchase Management
      - key: CORS_ORIGINS
        sync: false
    healthCheckPath: /health
